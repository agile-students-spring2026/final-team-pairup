services:
  backend:
    build:
      context: ./back-end
    container_name: pairup-backend
    env_file:
      - ./back-end/.env
    environment:
      PORT: 3000
      CORS_ORIGIN: http://localhost:8080
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./front-end
    container_name: pairup-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
